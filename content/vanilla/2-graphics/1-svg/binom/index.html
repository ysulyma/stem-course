<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binomial Theorem Visualization</title>

    <!-- OpenGraph tags -->
    <meta
      property="og:description"
      content="Visualize the binomial theorem"
    />
    <meta
      property="og:image"
      content="https://stem-course.liqvidjs.org/content/vanilla/2-graphics/1-svg/binom/opengraph.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="640" />
    <meta property="og:image:height" content="369" />
    <meta
      property="og:image:alt"
      content="Visualization of the different terms in the binomial theorem as paths"
    />
    <meta property="og:type" content="website" />

    <!-- Twitter tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Binomial Theorem Visualization" />
    <meta
      name="twitter:description"
      content="Visualize the binomial theorem"
    />
    <meta
      name="twitter:image"
      content="https://stem-course.liqvidjs.org/content/vanilla/2-graphics/1-svg/binom/twitter.png"
    />
    <meta
      name="twitter:url"
      content="https://stem-course.liqvidjs.org/content/vanilla/2-graphics/1-svg/binom/"
    />

    <!-- KaTeX -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.28/dist/katex.min.css"
      integrity="sha384-Wsr4Nh3yrvMf2KCebJchRJoVo1gTU6kcP05uRSh5NV3sj9+a8IomuJoQzf3sMq4T"
      crossorigin="anonymous"
    />

    <!-- The loading of KaTeX is deferred to speed up page rendering -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.28/dist/katex.min.js"
      integrity="sha384-+W9OcrYK2/bD7BmUAk+xeFAyKp0QjyRQUCxeU31dfyTt/FrPsUgaBTLLkVf33qWt"
      crossorigin="anonymous"
    ></script>

    <!-- To automatically render math in text elements, include the auto-render extension: -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.28/dist/contrib/auto-render.min.js"
      integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh"
      crossorigin="anonymous"
      onload="renderMathInElement(document.body)"
    ></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="controls">
    <label>n = <span id="nValue">3</span></label>
    <input type="range" id="slider" min="1" max="6" value="3">
  </div>
  <svg id="svg"></svg>
  <p>Hover over a term to see the corresponding path</p>
  <div id="equation"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
