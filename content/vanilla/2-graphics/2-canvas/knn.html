<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>k-nearest neighbors</title>
    <link href="knn.css" rel="stylesheet" />
  </head>
  <body>
    <main>
      <h1><var>k</var>-nearest neighbors</h1>
      <div id="controls">
        <button
          aria-checked
          class="color-selection"
          data-color="red"
          role="radio"
          style="background-color: red"
          type="button"
        ></button>
        <button
          class="color-selection"
          data-color="green"
          role="radio"
          style="background-color: green"
          type="button"
        ></button>
        <button
          class="color-selection"
          data-color="blue"
          role="radio"
          style="background-color: blue"
          type="button"
        ></button>
        <button id="clear" type="button">Clear</button>
        <div id="set-k">
          <label for="input-k"><var>k</var></label>
          <input id="input-k" type="range" min="1" max="5" name="k" value="1" />
          <span id="value-k">1</span>
        </div>
      </div>
      <div class="canvas-container">
        <canvas id="layer-dots"></canvas>
        <canvas id="layer-drawing"></canvas>
        <svg id="cursor" height="32" width="32" viewBox="-16 -16 32 32">
          <circle fill="red" r="4" />
        </svg>
      </div>
    </main>

    <script src="knn.js"></script>
  </body>
</html>
