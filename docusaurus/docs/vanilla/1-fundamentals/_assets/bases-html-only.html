<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number bases</title>
  </head>
  <body>
    <h1>Bases table</h1>
    <p>Enter a number to see it written in different bases</p>
    <table>
      <thead>
        <tr>
          <th scope="col">Base</th>
          <th scope="col">Value</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>2</td>
          <td>110</td>
        </tr>
        <tr>
          <td>3</td>
          <td>21</td>
        </tr>
        <tr>
          <td>4</td>
          <td>22</td>
        </tr>
        <tr>
          <td>5</td>
          <td>20</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
